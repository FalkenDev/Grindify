name: Grindify
description: Free, self-hostable workout tracker — routines, live session logging, progress stats and body metrics.
type: webapp
status: active
audience: public
urls:
  production: https://app.grindify.io
  admin: https://admin.grindify.io
  website: https://grindify.io
  repo: https://github.com/FalkenDev/Grindify
health: /api/v1/auth/health
version: /version.json
deploy:
  homelab_stack: projects/grindify
  containers: [grindify-frontend, grindify-backend, grindify-postgres, grindify-adminpanel]
  images:
    - ghcr.io/falkendev/grindify-frontend
    - ghcr.io/falkendev/grindify-api
    - ghcr.io/falkendev/grindify-adminpanel
services:
  - resend: { purpose: Verification and password reset email, env: [RESEND_API_KEY, EMAIL_FROM] }
  - github-oauth: { purpose: Sign in with GitHub, env: [GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET] }
  - google-oauth: { purpose: Sign in with Google, env: [GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET] }
  - cloudflare: { purpose: DNS, Tunnel and Access in front of admin.grindify.io }
  - ghcr: { purpose: Container images }
docs:
  contributing: CONTRIBUTING.md
  release_runbook: https://github.com/FalkenDev/Homelab/blob/main/stacks/projects/grindify/RELEASE.md
tags: [vue, nestjs, postgres, pwa, fitness]
